name: Update FX Charts

on:
  schedule:
    - cron: '0 12 * * 1-5' # 12:00 UTC, Mon-Fri
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Analysis Script
        env:
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
        run: python run_analysis.py

      - name: Commit data files to source repo
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add fx_data_raw.csv fx_data_emfx.csv
          git diff --staged --quiet || git commit -m "Update FX data CSVs"
          git push

      - name: Push HTML to boquin.github.io
        env:
          GH_TOKEN: ${{ secrets.BOQUIN_DEPLOY_TOKEN }}
        run: |
          gh repo clone DataVizHonduran/boquin.github.io _boquin -- --depth=1
          mkdir -p _boquin/reports/emfx-risk-diffusion
          cp index.html _boquin/reports/emfx-risk-diffusion/index.html
          cd _boquin
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add reports/emfx-risk-diffusion/
          git diff --staged --quiet || git commit -m "Update EMFX risk diffusion - $(date +'%Y-%m-%d')"
          git pull --rebase
          git push
